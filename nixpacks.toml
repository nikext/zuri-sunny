# Railway / Nixpacks build config.
# - Node 24: TanStack Start packages require >=22.12, but Railway's nodejs_22
#   resolves to 22.11 in their nixpkgs snapshot. Node 24 is available and
#   satisfies every package.
# - pnpm: matches local development; pnpm-lock.yaml is the source of truth.
# - python3 + gcc: fallback for better-sqlite3 if a prebuilt binary is missing
#   for this Node minor.

[phases.setup]
nixPkgs = ["nodejs_24", "python3", "gcc", "pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm run build"]

[start]
cmd = "pnpm run start"
